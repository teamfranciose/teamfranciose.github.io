<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFB3C6"/>
      <stop offset="30%"  stop-color="#FFF5B4"/>
      <stop offset="60%"  stop-color="#B5EDD7"/>
      <stop offset="100%" stop-color="#D4B8F0"/>
    </linearGradient>
    <linearGradient id="north" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7FA8"/>
      <stop offset="100%" stop-color="#FFB3C6"/>
    </linearGradient>
    <linearGradient id="south" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B5EDD7"/>
      <stop offset="100%" stop-color="#7DD9B8"/>
    </linearGradient>
    <linearGradient id="east" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B4D4FF"/>
      <stop offset="100%" stop-color="#7ABAFF"/>
    </linearGradient>
    <linearGradient id="west" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4B8F0"/>
      <stop offset="100%" stop-color="#B890E8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.18)"/>
    </filter>
  </defs>

  <!-- Background pill -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Outer compass ring -->
  <circle cx="256" cy="256" r="185" fill="white" opacity="0.6"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="white" stroke-width="6" opacity="0.9"/>

  <!-- Inner ring -->
  <circle cx="256" cy="256" r="80" fill="white" opacity="0.85" filter="url(#shadow)"/>

  <!-- North point (pink) -->
  <polygon points="256,80 236,240 256,220 276,240" fill="url(#north)"/>
  <!-- South point (green) -->
  <polygon points="256,432 236,272 256,292 276,272" fill="url(#south)"/>
  <!-- East point (blue) -->
  <polygon points="432,256 272,236 292,256 272,276" fill="url(#east)"/>
  <!-- West point (purple) -->
  <polygon points="80,256 240,236 220,256 240,276" fill="url(#west)"/>

  <!-- Diagonal tick marks -->
  <g stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <line x1="145" y1="145" x2="163" y2="163"/>
    <line x1="367" y1="145" x2="349" y2="163"/>
    <line x1="145" y1="367" x2="163" y2="349"/>
    <line x1="367" y1="367" x2="349" y2="349"/>
  </g>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="22" fill="#4A2D6B" opacity="0.85"/>
  <circle cx="256" cy="256" r="10" fill="white"/>

  <!-- N label -->
  <text x="256" y="118" text-anchor="middle" font-family="system-ui, sans-serif"
        font-weight="900" font-size="42" fill="#CC4477" opacity="0.9">N</text>
</svg>
